[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "devforge"
version = "2.0.0"
description = "Multi-agent code collaboration platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.50",
    "chromadb>=0.5",
    "numpy>=1.26",
    "pytest>=8.0",
    "requests>=2.31",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.ruff]
target-version = "py310"

[tool.setuptools.packages.find]
include = ["devforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src-layout：core/ 等包在 src/ 下（重构 Phase 1 起逐步迁入）
pythonpath = ["src"]
